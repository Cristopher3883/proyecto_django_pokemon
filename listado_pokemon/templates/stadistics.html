{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container-fluid px-4">
    <h1 class="mt-4">Pokemons</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
        <li class="breadcrumb-item active">Estadisticas</li>
    </ol>
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="input-group">
                    <select id="tipoDescarga" class="form-select">
                        <option value="">Seleccionar formato...</option>
                        <option value="pdf">Descargar PDF</option>
                        <option value="excel">Descargar Excel</option>
                    </select>
                    <button id="btnDescargar" class="btn btn-primary">
                        <i class="bi bi-download"></i> Descargar
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card mb-4">

        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <i class="fas fa-chart-bar me-1"></i>
                Estadísticas de Pokémon
            </div>
            <div>
                <!-- 🔽 Selector de tipo de estadística -->
                <select id="statSelect" class="form-select form-select-sm w-auto">
                    <option value="vida" selected>Vida (HP)</option>
                    <option value="ataque">Ataque</option>
                    <option value="defensa">Defensa</option>
                    <option value="velocidad">Velocidad</option>
                    <option value="defensa-especial">Defensa Especial</option>
                    <option value="ataque-especial">Ataque Especial</option>
                    <option value="num-pokemon">Numero de pokemons</option>
                </select>
            </div>
        </div>

        <div class="card-body " id="chartData"><canvas id="myBarChart" width="100%" height="40"
                data-labels='{{ nombres_tipos|safe }}' data-vida='{{ medias_vida|safe }}'
                data-ataque='{{ medias_ataque|safe }}' data-defensa='{{ medias_defensa|safe }}'
                data-velocidad='{{ medias_velocidad|safe }}' data-defensa-especial='{{ medias_especial_defensa|safe }}'
                data-ataque-especial='{{ medias_especial_ataque|safe }}' data-num-pokemon='{{ num_pokemon|safe }}'>
            </canvas></div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/export_pdf.js' %}"></script>
<script src="{% static 'js/export_excel.js' %}"></script>
<script src="{% static 'js/listado_pokemon/export.js' %}"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
{% endblock %}
